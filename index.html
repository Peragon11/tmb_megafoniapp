<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGAFONIAPP</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#121212;
  color:white;
  overflow:hidden;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:#1e1e1e;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  z-index:1000;
}

.leftIcons{display:flex;gap:12px;}
.iconBtn{font-size:24px;cursor:pointer;}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:bold;
}

#grid{
  position:fixed;
  top:60px;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
}

.pad{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-weight:bold;
  user-select:none;
  -webkit-user-select:none;
  cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}

.selected{
  transform:scale(0.92);
  opacity:0.6;
  outline:3px solid white;
}

#addCenter{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#2a2a2a;
  padding:30px;
  border-radius:16px;
  font-weight:bold;
  cursor:pointer;
  z-index:2000;
}

#menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  flex-direction:column;
  z-index:3000;
}

#menuList{flex:1;overflow:auto;padding:10px;}

.menuItem{
  margin:10px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

.menuItem.used{opacity:0.3;}

.back{
  margin:10px;
  padding:14px;
  background:#555;
  text-align:center;
  border-radius:10px;
}

#help{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  display:none;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="leftIcons">
    <div class="iconBtn" onclick="openMenu()">＋</div>
    <div class="iconBtn" id="editBtn" onclick="toggleEdit()" style="display:none;">☰</div>
  </div>

  <div class="title">MEGAFONIAPP</div>
  <div style="width:40px;"></div>
</div>

<div id="addCenter" onclick="openMenu()">AÑADIR AUDIO</div>
<div id="grid"></div>

<div id="menu">
  <div id="menuList"></div>
  <div class="back" onclick="closeMenu()">ATRÁS</div>
</div>

<div id="help">Modo edición: selecciona un botón y luego otro para intercambiarlos</div>

<script>

const MAX=8;

/* AUDIO CONFIG */
const items=[
{id:"r1",name:"SERVICIO FINALIZADO FONDO",color:"#d32f2f",audio:"audios/fondo.mp3"},
{id:"r2",name:"SERVICIO HOSPITAL BELLVITGE FINALIZADO",color:"#c62828",audio:"audios/bellvitge.mp3"},
{id:"p1",name:"SERVICIO PARAL·LEL FINALIZADO",color:"#7e57c2",audio:"audios/parallel.mp3"},
{id:"p2",name:"SERVICIO BADALONA POMPEU FABRA FINALIZADO",color:"#673ab7",audio:"audios/pompeu.mp3"},
{id:"g1",name:"SERVICIO TRINITAT NOVA FINALIZADO",color:"#2e7d32",audio:"audios/trinitat.mp3"},
{id:"g2",name:"SERVICIO ZONA UNIVERSITARIA FINALIZADO",color:"#1b5e20",audio:"audios/zona.mp3"},
{id:"y1",name:"SERVICIO LA PAU FINALIZADO",color:"#fdd835",audio:"audios/lapau.mp3"},
{id:"y2",name:"SERVICIO TRINITAT NOVA 2 FINALIZADO",color:"#fbc02d",audio:"audios/trinitat2.mp3"},
{id:"b1",name:"SERVICIO VALL D'HEBRON FINALIZADO",color:"#1976d2",audio:"audios/vall.mp3"},
{id:"b2",name:"SERVICIO CORNELLA CENTRE FINALIZADO",color:"#1565c0",audio:"audios/cornella.mp3"},
{id:"o1",name:"SOLICITUD SEGURIDAD",color:"#ff9800",audio:"audios/seguridad.mp3"},
{id:"m1",name:"SOLICITUD AAC",color:"#800020",audio:"audios/aac.mp3"},
{id:"m2",name:"CLIENTES NO SE ACERQUEN AL BORDE",color:"#5d4037",audio:"audios/borde.mp3"},
{id:"m3",name:"CLIENTES SE REPARTAN AL ANDÉN",color:"#009688",audio:"audios/anden.mp3"}
];

let active=JSON.parse(localStorage.getItem("active"))||[];
let editMode=false;
let selected=null;
let currentAudio=null;

/* SAVE */
function save(){
localStorage.setItem("active",JSON.stringify(active));
}

/* AUDIO SAFE PLAY (FIX MÓVIL REAL) */
function playAudio(src){
try{
if(currentAudio){
currentAudio.pause();
currentAudio.currentTime=0;
}

currentAudio=new Audio(src);
currentAudio.volume=1;

const playPromise=currentAudio.play();

if(playPromise!==undefined){
playPromise.catch(err=>{
console.log("Audio bloqueado o error:",err);
});
}

}catch(e){
console.log("Error audio:",e);
}
}

/* EDIT MODE */
function toggleEdit(){
editMode=!editMode;
selected=null;

document.getElementById("help").style.display=
editMode?"block":"none";

render();
}

/* SWAP */
function swap(a,b){
const tmp=active[a];
active[a]=active[b];
active[b]=tmp;
save();
}

/* CLICK LOGIC */
function handleClick(i){
const id=active[i];
const it=items.find(x=>x.id===id);

/* MODO NORMAL -> AUDIO */
if(!editMode){
if(it && it.audio){
playAudio(it.audio);
}
return;
}

/* MODO EDIT */
if(selected===null){
selected=i;
}else{
if(selected===i){
selected=null;
render();
return;
}

swap(selected,i);
selected=null;
render();
}
render();
}

/* RENDER */
function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";

active.forEach((id,i)=>{
const it=items.find(x=>x.id===id);

const div=document.createElement("div");
div.className="pad";
div.style.background=it.color;
div.textContent=it.name;

if(editMode && selected===i){
div.classList.add("selected");
}

div.onclick=()=>handleClick(i);

grid.appendChild(div);
});

document.getElementById("addCenter").style.display=
active.length===0?"block":"none";

document.getElementById("editBtn").style.display=
active.length>=2?"block":"none";
}

/* MENU */
function openMenu(){
document.getElementById("menu").style.display="flex";

const list=document.getElementById("menuList");
list.innerHTML="";

items.forEach(it=>{
const on=active.includes(it.id);

const div=document.createElement("div");
div.className="menuItem"+(on?" used":"");
div.style.background=it.color;
div.textContent=it.name;

div.onclick=()=>{
if(on){
active=active.filter(x=>x!==it.id);
}else{
if(active.length>=MAX) return;
active.push(it.id);
}
save();
render();
openMenu();
};

list.appendChild(div);
});
}

function closeMenu(){
document.getElementById("menu").style.display="none";
}

render();

/* REGISTRO DEL SERVICE WORKER */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registrado con éxito', reg))
      .catch(err => console.error('Error al registrar el Service Worker', err));
  });
}

</script>

</body>
</html>
