<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGAFONIAPP</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#121212;
  color:white;
  overflow:hidden;
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#1e1e1e;
  z-index:1000;
}

.left{
  display:flex;
  gap:12px;
}

.icon{
  font-size:22px;
  cursor:pointer;
}

/* GRID */
#grid{
  position:fixed;
  top:60px;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
}

/* BOTONES */
.pad{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-weight:bold;
  position:relative;
  user-select:none;
}

.handle{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  display:none;
}

.drag .handle{
  display:block;
}

/* BOTON CENTRAL */
#addCenter{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#2a2a2a;
  padding:30px;
  border-radius:16px;
  z-index:2000;
  cursor:pointer;
}

/* MENU */
#menu{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  z-index:3000;
}

.item{
  margin:10px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.item.used{
  opacity:0.3;
}

.back{
  margin:10px;
  padding:15px;
  background:#444;
  text-align:center;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="left" id="leftIcons">
    <div class="icon" onclick="openMenu()">＋</div>
  </div>
  <div>MEGAFONIAPP</div>
  <div></div>
</div>

<div id="addCenter" onclick="openMenu()">＋ AÑADIR</div>

<div id="grid"></div>

<div id="menu">
  <div id="menuList"></div>
  <div class="back" onclick="closeMenu()">ATRÁS</div>
</div>

<script>

const MAX = 8;

const items = [
  {id:"1",name:"ROJO 1",color:"#d32f2f"},
  {id:"2",name:"ROJO 2",color:"#c62828"},
  {id:"3",name:"VERDE",color:"#2e7d32"},
  {id:"4",name:"AZUL",color:"#1976d2"},
  {id:"5",name:"AMARILLO",color:"#fbc02d"},
  {id:"6",name:"NARANJA",color:"#ff9800"},
  {id:"7",name:"MARRON",color:"#5d4037"},
  {id:"8",name:"GRIS",color:"#616161"},
  {id:"9",name:"EXTRA",color:"#9c27b0"}
];

let active = JSON.parse(localStorage.getItem("active")) || [];
let dragMode = false;
let dragging = null;

/* GUARDAR */
function save(){
  localStorage.setItem("active",JSON.stringify(active));
}

/* ICONO ORDEN */
function renderDragBtn(){
  const left = document.getElementById("leftIcons");
  const old = document.getElementById("dragBtn");
  if(old) old.remove();

  if(active.length >= 2){
    const btn = document.createElement("div");
    btn.id="dragBtn";
    btn.className="icon";
    btn.textContent="☰";
    btn.onclick=()=>{
      dragMode = !dragMode;
      render();
    };
    left.appendChild(btn);
  }else{
    dragMode=false;
  }
}

/* RENDER */
function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML="";

  active.forEach((id,index)=>{
    const it = items.find(x=>x.id===id);

    const div = document.createElement("div");
    div.className="pad";
    div.style.background=it.color;
    div.textContent=it.name;

    const handle = document.createElement("div");
    handle.className="handle";
    handle.textContent="☰";
    div.appendChild(handle);

    /* DRAG TOUCH + MOUSE */
    if(dragMode){

      div.onmousedown = ()=> dragging=index;

      div.onmousemove = (e)=>{
        if(dragging===null) return;
        const el = document.elementFromPoint(e.clientX,e.clientY);
        move(el,index);
      };

      div.ontouchstart = ()=> dragging=index;

      div.ontouchmove = (e)=>{
        const t = e.touches[0];
        const el = document.elementFromPoint(t.clientX,t.clientY);
        move(el,index);
      };

      div.onmouseup = stop;
      div.ontouchend = stop;
    }

    grid.appendChild(div);
  });

  document.body.classList.toggle("drag",dragMode);

  document.getElementById("addCenter").style.display =
    active.length===0 ? "block":"none";

  renderDragBtn();
}

/* MOVER */
function move(el,from){
  if(!el) return;
  const target = el.closest(".pad");
  if(!target) return;

  const nodes = [...document.querySelectorAll(".pad")];
  const to = nodes.indexOf(target);

  if(to===-1 || to===from) return;

  const tmp = active[from];
  active[from]=active[to];
  active[to]=tmp;

  dragging = to;

  render();
}

/* FIN DRAG */
function stop(){
  dragging=null;
  save();
}

/* MENU */
function openMenu(){
  document.getElementById("menu").style.display="flex";
  const list = document.getElementById("menuList");
  list.innerHTML="";

  items.forEach(it=>{
    const on = active.includes(it.id);

    const div=document.createElement("div");
    div.className="item"+(on?" used":"");
    div.style.background=it.color;
    div.textContent=it.name;

    div.onclick=()=>{
      if(on){
        active=active.filter(x=>x!==it.id);
      }else{
        if(active.length>=MAX) return;
        active.push(it.id);
      }
      save();
      render();
      openMenu();
    };

    list.appendChild(div);
  });
}

function closeMenu(){
  document.getElementById("menu").style.display="none";
}

/* INIT */
render();

</script>

</body>
</html>
