<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMB MEGAFONIAPP</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#121212;
  color:white;
  overflow:hidden;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  background:#1e1e1e;
  z-index:2000;
}

.leftIcons{
  display:flex;
  gap:12px;
}

.iconBtn{
  font-size:24px;
  cursor:pointer;
}

#grid{
  position:fixed;
  top:60px;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
}

.pad{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-weight:bold;
  position:relative;
}

.handle{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  display:none;
}

.dragMode .handle{
  display:block;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  flex-direction:column;
  z-index:3000;
}

.menuItem{
  margin:10px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.menuItem.used{
  opacity:0.3;
}

.back{
  margin:10px;
  padding:14px;
  background:#555;
  text-align:center;
  border-radius:10px;
}

.centerAdd{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#2a2a2a;
  padding:30px;
  border-radius:16px;
  z-index:2500;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="leftIcons" id="leftIcons">
    <div class="iconBtn" onclick="openMenu()">＋</div>
  </div>
</div>

<div id="centerAdd" class="centerAdd" onclick="openMenu()">＋ AÑADIR</div>

<div id="grid"></div>

<div id="menu" class="overlay">
  <div id="menuList"></div>
  <div class="back" onclick="closeMenu()">ATRÁS</div>
</div>

<script>

const MAX_VISIBLE = 8;

const items = [
  {id:"1", name:"ROJO 1", color:"#d32f2f"},
  {id:"2", name:"ROJO 2", color:"#c62828"},
  {id:"3", name:"AMARILLO 1", color:"#fdd835"},
  {id:"4", name:"AMARILLO 2", color:"#fbc02d"},
  {id:"5", name:"AZUL 1", color:"#1976d2"},
  {id:"6", name:"AZUL 2", color:"#1565c0"},
];

let active = JSON.parse(localStorage.getItem("active")) || [];
let dragMode = false;

let touchIndex = null;

function save(){
  localStorage.setItem("active", JSON.stringify(active));
}

function renderDragIcon(){
  const container = document.getElementById("leftIcons");
  const existing = document.getElementById("dragBtn");
  if(existing) existing.remove();

  if(active.length >= 2){
    const btn = document.createElement("div");
    btn.id="dragBtn";
    btn.className="iconBtn";
    btn.textContent="☰";
    btn.onclick=()=>{ dragMode=!dragMode; render(); };
    container.appendChild(btn);
  }else{
    dragMode=false;
  }
}

function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML="";

  active.forEach((id,index)=>{
    const it = items.find(x=>x.id===id);

    const div = document.createElement("div");
    div.className="pad";
    div.style.background=it.color;
    div.textContent=it.name;

    const handle=document.createElement("div");
    handle.className="handle";
    handle.textContent="☰";
    div.appendChild(handle);

    /* TOUCH DRAG */
    if(dragMode){

      div.addEventListener("touchstart", ()=>{
        touchIndex=index;
      });

      div.addEventListener("touchmove", (e)=>{
        e.preventDefault();

        const touch = e.touches[0];
        const element = document.elementFromPoint(touch.clientX, touch.clientY);

        if(!element) return;

        const target = element.closest(".pad");
        if(!target) return;

        const nodes = [...document.querySelectorAll(".pad")];
        const newIndex = nodes.indexOf(target);

        if(newIndex !== touchIndex){
          const tmp = active[touchIndex];
          active[touchIndex] = active[newIndex];
          active[newIndex] = tmp;
          touchIndex = newIndex;
          render();
        }
      });

      div.addEventListener("touchend", ()=>{
        save();
        touchIndex=null;
      });
    }

    grid.appendChild(div);
  });

  document.body.classList.toggle("dragMode", dragMode);

  document.getElementById("centerAdd").style.display =
    active.length === 0 ? "block" : "none";

  renderDragIcon();
}

function openMenu(){
  document.getElementById("menu").style.display="flex";
  const list=document.getElementById("menuList");
  list.innerHTML="";

  items.forEach(it=>{
    const on=active.includes(it.id);

    const div=document.createElement("div");
    div.className="menuItem"+(on?" used":"");
    div.style.background=it.color;
    div.textContent=it.name;

    div.onclick=()=>{
      if(on){
        active=active.filter(x=>x!==it.id);
      }else{
        if(active.length>=MAX_VISIBLE) return;
        active.push(it.id);
      }
      save();
      render();
      openMenu();
    };

    list.appendChild(div);
  });
}

function closeMenu(){
  document.getElementById("menu").style.display="none";
}

render();

</script>

</body>
</html>
