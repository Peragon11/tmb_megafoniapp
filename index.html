<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGAFONIAPP</title>

<!-- ENLACES PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#121212;
  color:white;
  overflow:hidden;
  /* SOLUCIÓN: Desactiva el recuadro azul de selección al pulsar en cualquier parte de la app */
  -webkit-tap-highlight-color: transparent; 
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:#1e1e1e;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  z-index:1000;
}

.leftIcons{display:flex;gap:12px;}
.iconBtn{font-size:24px;cursor:pointer;transition: color 0.15s ease;}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:bold;
}

#grid{
  position:fixed;
  top:60px;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
}

.pad{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 10px;
  border-radius:16px;
  font-weight:bold;
  user-select:none;
  -webkit-user-select:none;
  cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}

.selected{
  transform:scale(0.92);
  opacity:0.6;
  outline:3px solid white;
}

#addCenter{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#2a2a2a;
  padding:30px;
  border-radius:16px;
  font-weight:bold;
  cursor:pointer;
  z-index:2000;
}

#menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  flex-direction:column;
  z-index:3000;
}

#menuList{flex:1;overflow:auto;padding:10px;}

.menuItem{
  margin:10px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

.menuItem.used{opacity:0.3;}

.back{
  margin:10px;
  padding:14px;
  background:#555;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}

#help{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  display:none;
  text-align:center;
  white-space:nowrap;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="leftIcons">
    <div class="iconBtn" onclick="openMenu()">＋</div>
    <div class="iconBtn" id="editBtn" onclick="toggleEdit()" style="display:none;">☰</div>
  </div>

  <div class="title">MEGAFONIAPP</div>
  <div style="width:40px;"></div>
</div>

<div id="addCenter" onclick="openMenu()">AÑADIR AUDIO</div>
<div id="grid"></div>

<div id="menu">
  <div id="menuList"></div>
  <div class="back" onclick="closeMenu()">ATRÁS</div>
</div>

<div id="help">Selecciona un botón y después otro para intercambiarlos.</div>

<script>

const MAX=8;

/* TONOS UNIFICADOS EXACTOS */
const COLOR_ROJO = "#c62828";
const COLOR_MORADO = "#673ab7";
const COLOR_VERDE = "#1b5e20";
const COLOR_AMARILLO = "#fbc02d";
const COLOR_AZUL = "#1565c0";
const COLOR_NARANJA = "#ff9800";
const COLOR_BURDEOS = "#800020";
const COLOR_MARRON = "#5d4037";
const COLOR_TEJA = "#009688";

/* AUDIO CONFIG */
const items=[
{id:"r1",name:"SERVICIO FINALIZADO FONDO",color:COLOR_ROJO,audio:"audios/fondo.mp3"},
{id:"r2",name:"SERVICIO HOSPITAL BELLVITGE FINALIZADO",color:COLOR_ROJO,audio:"audios/bellvitge.mp3"},
{id:"p1",name:"SERVICIO PARAL·LEL FINALIZADO",color:COLOR_MORADO,audio:"audios/parallel.mp3"},
{id:"p2",name:"SERVICIO BADALONA POMPEU FABRA FINALIZADO",color:COLOR_MORADO,audio:"audios/pompeu.mp3"},
{id:"g1",name:"SERVICIO TRINITAT NOVA FINALIZADO",color:COLOR_VERDE,audio:"audios/trinitat.mp3"},
{id:"g2",name:"SERVICIO ZONA UNIVERSITARIA FINALIZADO",color:COLOR_VERDE,audio:"audios/zona.mp3"},
{id:"y1",name:"SERVICIO LA PAU FINALIZADO",color:COLOR_AMARILLO,audio:"audios/lapau.mp3"},
{id:"y2",name:"SERVICIO TRINITAT NOVA FINALIZADO",color:COLOR_AMARILLO,audio:"audios/trinitat.mp3"},
{id:"b1",name:"SERVICIO VALL D'HEBRON FINALIZADO",color:COLOR_AZUL,audio:"audios/vall.mp3"},
{id:"b2",name:"SERVICIO CORNELLA CENTRE FINALIZADO",color:COLOR_AZUL,audio:"audios/cornella.mp3"},
{id:"o1",name:"SOLICITUD SEGURIDAD",color:COLOR_NARANJA,audio:"audios/seguridad.mp3"},
{id:"m1",name:"SOLICITUD AAC",color:COLOR_BURDEOS,audio:"audios/aac.mp3"},
{id:"m2",name:"CLIENTES NO SE ACERQUEN AL BORDE",color:COLOR_MARRON,audio:"audios/borde.mp3"},
{id:"m3",name:"CLIENTES SE REPARTAN AL ANDÉN",color:COLOR_TEJA,audio:"audios/anden.mp3"}
];

let active=[];
try {
  let saved = localStorage.getItem("active");
  if(saved) {
    active = JSON.parse(saved);
    if(!Array.isArray(active)) active = [];
  }
} catch(e) {
  active = [];
}

let editMode=false;
let selected=null;
let currentAudio=null;

/* SAVE */
function save(){
  localStorage.setItem("active",JSON.stringify(active));
}

/* AUDIO SAFE PLAY */
function playAudio(src){
  try{
    if(currentAudio){
      currentAudio.pause();
      currentAudio.currentTime=0;
    }

    currentAudio=new Audio(src);
    currentAudio.volume=1;

    const playPromise=currentAudio.play();

    if(playPromise!==undefined){
      playPromise.catch(err=>{
        console.log("Audio bloqueado o error:",err);
      });
    }
  }catch(e){
    console.log("Error audio:",e);
  }
}

/* EDIT MODE */
function toggleEdit(){
  editMode=!editMode;
  selected=null;

  document.getElementById("help").style.display=editMode?"block":"none";
  document.getElementById("editBtn").style.color = editMode ? "#ff4444" : "white";

  render();
}

/* SWAP */
function swap(a,b){
  const tmp=active[a];
  active[a]=active[b];
  active[b]=tmp;
  save();
}

/* CLICK LOGIC */
function handleClick(i){
  const id=active[i];
  const it=items.find(x=>x.id===id);

  /* MODO NORMAL -> AUDIO */
  if(!editMode){
    if(it && it.audio){
      playAudio(it.audio);
    }
    return;
  }

  /* MODO EDIT */
  if(selected===null){
    selected=i;
    render();
  }else{
    if(selected===i){
      selected=null;
      render();
      return;
    }
    swap(selected,i);
    selected=null;
    render();
  }
}

/* RENDER PANTALLA PRINCIPAL */
function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  active.forEach((id,i)=>{
    const it=items.find(x=>x.id===id);
    if(!it) return;

    const div=document.createElement("div");
    div.className="pad";
    div.style.background=it.color;
    div.textContent=it.name;

    if(editMode && selected===i){
      div.classList.add("selected");
    }

    div.onclick=()=>handleClick(i);
    grid.appendChild(div);
  });

  if (active.length === 0) {
    document.getElementById("addCenter").style.display = "block";
  } else {
    document.getElementById("addCenter").style.display = "none";
  }

  if (active.length >= 2) {
    document.getElementById("editBtn").style.display = "block";
  } else {
    document.getElementById("editBtn").style.display = "none";
  }
}

/* MENÚ SELECCIÓN DE AUDIOS */
function openMenu(){
  if (editMode) {
    editMode = false;
    selected = null;
    document.getElementById("help").style.display = "none";
    document.getElementById("editBtn").style.color = "white";
    render();
  }

  document.getElementById("menu").style.display = "flex";
  renderMenuList();
}

function renderMenuList(){
  const list = document.getElementById("menuList");
  list.innerHTML = "";

  items.forEach(it => {
    const on = active.includes(it.id);

    const div = document.createElement("div");
    div.className = "menuItem" + (on ? " used" : "");
    div.style.background = it.color;
    div.textContent = it.name;

    div.onclick = () => {
      if(on){
        active = active.filter(x => x !== it.id);
      } else {
        if(active.length >= MAX) return;
        active.push(it.id);
      }
      save();
      render(); 
      renderMenuList(); 
    };

    list.appendChild(div);
  });
}

function closeMenu(){
  document.getElementById("menu").style.display = "none";
}

// Inicialización
render();

/* REGISTRO DEL SERVICE WORKER (PWA) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registrado', reg))
      .catch(err => console.error('Error Worker', err));
  });
}

</script>

</body>
</html>
