<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGAFONIAPP</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#121212;
  color:white;
  overflow:hidden;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  background:#1e1e1e;
  z-index:1000;
}

.leftIcons{display:flex;gap:12px;}
.iconBtn{font-size:24px;cursor:pointer;}

#grid{
  position:fixed;
  top:60px;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
}

.pad{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  font-weight:bold;
  position:relative;
  user-select:none;
}

/* HANDLE LATERAL */
.handle{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  display:none;
}

.editMode .handle{
  display:block;
}

#addCenter{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#2a2a2a;
  padding:30px;
  border-radius:16px;
  cursor:pointer;
  z-index:2000;
}

#menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  flex-direction:column;
  z-index:3000;
}

#menuList{flex:1;overflow:auto;padding:10px;}

.menuItem{
  margin:10px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.menuItem.used{opacity:0.3;}
.back{margin:10px;padding:14px;background:#555;text-align:center;border-radius:10px;}
</style>
</head>

<body>

<div class="topbar">
  <div class="leftIcons">
    <div class="iconBtn" onclick="openMenu()">＋</div>
    <div id="editBtn" class="iconBtn" onclick="toggleEdit()" style="display:none;">☰</div>
  </div>
  <div>MEGAFONIAPP</div>
</div>

<div id="addCenter" onclick="openMenu()">AÑADIR AUDIO</div>

<div id="grid"></div>

<div id="menu">
  <div id="menuList"></div>
  <div class="back" onclick="closeMenu()">ATRÁS</div>
</div>

<script>

const MAX=8;

const items=[
{id:"r1",name:"SERVICIO FINALIZADO FONDO",color:"#d32f2f"},
{id:"r2",name:"SERVICIO HOSPITAL BELLVITGE FINALIZADO",color:"#c62828"},
{id:"p1",name:"SERVICIO PARAL·LEL FINALIZADO",color:"#7e57c2"},
{id:"p2",name:"SERVICIO BADALONA POMPEU FABRA FINALIZADO",color:"#673ab7"},
{id:"g1",name:"SERVICIO TRINITAT NOVA FINALIZADO",color:"#2e7d32"},
{id:"g2",name:"SERVICIO ZONA UNIVERSITARIA FINALIZADO",color:"#1b5e20"},
{id:"y1",name:"SERVICIO LA PAU FINALIZADO",color:"#fdd835"},
{id:"y2",name:"SERVICIO TRINITAT NOVA 2 FINALIZADO",color:"#fbc02d"},
{id:"b1",name:"SERVICIO VALL D'HEBRON FINALIZADO",color:"#1976d2"},
{id:"b2",name:"SERVICIO CORNELLA CENTRE FINALIZADO",color:"#1565c0"},
{id:"o1",name:"SOLICITUD SEGURIDAD",color:"#ff9800"},
{id:"m1",name:"SOLICITUD AAC",color:"#800020"},
{id:"m2",name:"CLIENTES NO SE ACERQUEN AL BORDE",color:"#5d4037"},
{id:"m3",name:"CLIENTES SE REPARTAN AL ANDÉN",color:"#009688"}
];

let active=JSON.parse(localStorage.getItem("active"))||[];
let editMode=false;
let dragIndex=null;

function save(){
localStorage.setItem("active",JSON.stringify(active));
}

/* BOTON EDIT */
function updateEditBtn(){
const btn=document.getElementById("editBtn");
btn.style.display=active.length>=2?"block":"none";
if(active.length<2) editMode=false;
}

/* TOGGLE EDIT */
function toggleEdit(){
editMode=!editMode;
document.body.classList.toggle("editMode",editMode);
render();
}

/* RENDER */
function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";

active.forEach((id,i)=>{
const it=items.find(x=>x.id===id);

const div=document.createElement("div");
div.className="pad";
div.style.background=it.color;
div.textContent=it.name;

/* HANDLE */
if(editMode){
const h=document.createElement("div");
h.className="handle";
h.textContent="☰";
div.appendChild(h);

div.draggable=true;

/* PC */
div.ondragstart=(e)=>dragIndex=i;
div.ondragover=(e)=>e.preventDefault();
div.ondrop=(e)=>{
const tmp=active[dragIndex];
active[dragIndex]=active[i];
active[i]=tmp;
render();
};

/* MOBILE */
div.ontouchstart=()=>dragIndex=i;

div.ontouchmove=(e)=>{
const t=e.touches[0];
const el=document.elementFromPoint(t.clientX,t.clientY);
const target=el?.closest(".pad");
if(!target) return;

const nodes=[...document.querySelectorAll(".pad")];
const to=nodes.indexOf(target);

if(to!==dragIndex && to>=0){
const tmp=active[dragIndex];
active[dragIndex]=active[to];
active[to]=tmp;
dragIndex=to;
render();
}
};

div.ontouchend=()=>{
save();
dragIndex=null;
};
}

grid.appendChild(div);
});

document.getElementById("addCenter").style.display=
active.length===0?"block":"none";

updateEditBtn();
}

/* MENU */
function openMenu(){
document.getElementById("menu").style.display="flex";

const list=document.getElementById("menuList");
list.innerHTML="";

items.forEach(it=>{
const on=active.includes(it.id);

const div=document.createElement("div");
div.className="menuItem"+(on?" used":"");
div.style.background=it.color;
div.textContent=it.name;

div.onclick=()=>{
if(on){
active=active.filter(x=>x!==it.id);
}else{
if(active.length>=MAX) return;
active.push(it.id);
}
save();
render();
openMenu();
};

list.appendChild(div);
});
}

function closeMenu(){
document.getElementById("menu").style.display="none";
}

render();

</script>

</body>
</html>
